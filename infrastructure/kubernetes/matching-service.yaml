# ============================================================
# RideX - Matching Service
# infrastructure/kubernetes/matching-service.yaml
# ============================================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: matching-service
  namespace: ridex

  labels:
    app: matching-service
    app.kubernetes.io/name: matching-service
    app.kubernetes.io/part-of: ridex

spec:
  replicas: 1

  selector:
    matchLabels:
      app: matching-service

  template:
    metadata:
      labels:
        app: matching-service
        app.kubernetes.io/name: matching-service
        app.kubernetes.io/part-of: ridex

    spec:
      containers:
        - name: matching-service

          image: ridex-matching-service:latest

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8004
              protocol: TCP

          env:
            # ------------------------------------------------
            # Database
            # ------------------------------------------------

            - name: DATABASE_URL
              value: "postgresql://ridex:ridex_dev_password@postgres:5432/ridex"

            # ------------------------------------------------
            # Application
            # ------------------------------------------------

            - name: SERVICE_NAME
              value: "matching-service"

            - name: SERVICE_PORT
              value: "8004"

            - name: ENVIRONMENT
              value: "development"

            # ------------------------------------------------
            # Internal RideX Services
            # ------------------------------------------------

            - name: DRIVER_SERVICE_URL
              value: "http://driver-service:8002"

            - name: RIDE_SERVICE_URL
              value: "http://ride-service:8003"

            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:8007"

            # ------------------------------------------------
            # Matching Configuration
            # ------------------------------------------------

            - name: SEARCH_RADIUS_KM
              value: "5"

            - name: MAX_DRIVER_RESULTS
              value: "10"

            - name: MATCH_TIMEOUT_SECONDS
              value: "30"

          # --------------------------------------------------
          # Readiness Probe
          # --------------------------------------------------

          readinessProbe:
            httpGet:
              path: /health
              port: 8004

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # --------------------------------------------------
          # Liveness Probe
          # --------------------------------------------------

          livenessProbe:
            httpGet:
              path: /health
              port: 8004

            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          # --------------------------------------------------
          # Resource Management
          # --------------------------------------------------

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

---
# ============================================================
# Matching Service - Kubernetes Service
# ============================================================

apiVersion: v1
kind: Service

metadata:
  name: matching-service
  namespace: ridex

  labels:
    app: matching-service
    app.kubernetes.io/name: matching-service
    app.kubernetes.io/part-of: ridex

spec:
  # Internal service only
  type: ClusterIP

  selector:
    app: matching-service

  ports:
    - name: http
      protocol: TCP

      port: 8004

      targetPort: 8004

# ============================================================
# RideX - User Service
# infrastructure/kubernetes/user-service.yaml
# ============================================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: user-service
  namespace: ridex

  labels:
    app: user-service
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: ridex

spec:
  replicas: 1

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service
        app.kubernetes.io/name: user-service
        app.kubernetes.io/part-of: ridex

    spec:
      containers:
        - name: user-service

          image: ridex-user-service:latest

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8001
              protocol: TCP

          env:
            # ------------------------------------------------
            # Database
            # ------------------------------------------------

            - name: DATABASE_URL
              value: "postgresql://ridex:ridex_dev_password@postgres:5432/ridex"

            # ------------------------------------------------
            # Application
            # ------------------------------------------------

            - name: SERVICE_NAME
              value: "user-service"

            - name: SERVICE_PORT
              value: "8001"

            - name: ENVIRONMENT
              value: "development"

          # --------------------------------------------------
          # Readiness Probe
          # --------------------------------------------------

          readinessProbe:
            httpGet:
              path: /health
              port: 8001

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # --------------------------------------------------
          # Liveness Probe
          # --------------------------------------------------

          livenessProbe:
            httpGet:
              path: /health
              port: 8001

            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          # --------------------------------------------------
          # Resource Management
          # --------------------------------------------------

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

---
# ============================================================
# User Service - Kubernetes Service
# ============================================================

apiVersion: v1
kind: Service

metadata:
  name: user-service
  namespace: ridex

  labels:
    app: user-service
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: ridex

spec:
  type: ClusterIP

  selector:
    app: user-service

  ports:
    - name: http
      protocol: TCP

      port: 8001

      targetPort: 8001

# ============================================================
# RideX - API Gateway
# infrastructure/kubernetes/api-gateway.yaml
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ridex
  labels:
    app: api-gateway
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: ridex

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: ridex

    spec:
      containers:
        - name: api-gateway

          image: ridex-api-gateway:latest

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            # PostgreSQL
            - name: DATABASE_URL
              value: "postgresql://ridex:ridex_dev_password@postgres:5432/ridex"

            # RideX backend services
            - name: USER_SERVICE_URL
              value: "http://user-service:8001"

            - name: DRIVER_SERVICE_URL
              value: "http://driver-service:8002"

            - name: RIDE_SERVICE_URL
              value: "http://ride-service:8003"

            - name: MATCHING_SERVICE_URL
              value: "http://matching-service:8004"

            - name: PRICING_SERVICE_URL
              value: "http://pricing-service:8005"

            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:8006"

            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:8007"

            - name: RATING_SAFETY_SERVICE_URL
              value: "http://rating-safety-service:8008"

          # --------------------------------------------------
          # Health checks
          # --------------------------------------------------

          readinessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          # --------------------------------------------------
          # Resource limits
          # --------------------------------------------------

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

---
# ============================================================
# API Gateway Service
# ============================================================

apiVersion: v1
kind: Service

metadata:
  name: api-gateway
  namespace: ridex

  labels:
    app: api-gateway
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: ridex

spec:
  type: NodePort

  selector:
    app: api-gateway

  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080
